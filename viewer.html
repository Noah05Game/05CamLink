<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>05CamLink — OBS Viewer</title>
<style>
  :root { --accent:#32d6ff; --rec:#ff453a; --bg:#000; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif; color:#f5f7fa; }
  #v { position:fixed; inset:0; width:100%; height:100%; object-fit:contain; background:#000; }
  .badge { position:fixed; top:14px; left:14px; z-index:5; display:none; align-items:center; gap:8px;
    padding:7px 12px; border-radius:999px; font-size:12px; font-weight:640;
    background:rgba(16,21,31,.7); border:1px solid rgba(255,255,255,.12); backdrop-filter:blur(14px); }
  .badge.on { display:inline-flex; }
  .badge .d { width:9px; height:9px; border-radius:50%; background:var(--rec);
    box-shadow:0 0 0 0 rgba(255,69,58,.6); animation:t 1.6s infinite; }
  @keyframes t { 70%{box-shadow:0 0 0 9px rgba(255,69,58,0);} 100%{box-shadow:0 0 0 0 rgba(255,69,58,0);} }
  .panel { position:fixed; inset:0; z-index:10; display:flex; flex-direction:column; gap:14px;
    align-items:center; justify-content:center; padding:24px; text-align:center;
    background:radial-gradient(120% 80% at 50% -10%,#1a2336,#0b0e14 60%); }
  .panel.hidden { display:none; }
  .mark { width:64px; height:64px; border-radius:18px; display:grid; place-items:center; font-weight:800;
    font-size:24px; letter-spacing:-.04em; background:linear-gradient(160deg,#1a2336,#0d1119);
    border:1px solid rgba(255,255,255,.1); }
  h1 { font-size:21px; font-weight:720; letter-spacing:-.02em; margin:6px 0 0; }
  p { color:rgba(245,247,250,.6); font-size:14px; max-width:380px; line-height:1.5; margin:0; }
  textarea { width:min(420px,90vw); height:80px; border-radius:12px; padding:11px; font-size:11px;
    font-family:ui-monospace,Menlo,monospace; color:#f5f7fa; background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.12); resize:vertical; }
  textarea:focus { outline:none; border-color:var(--accent); }
  .btn { padding:12px 18px; border-radius:14px; font-size:15px; font-weight:640; border:none; cursor:pointer;
    color:#04222c; background:var(--accent); }
  .btn.ghost { background:rgba(255,255,255,.08); color:#f5f7fa; border:1px solid rgba(255,255,255,.12); }
  .row { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
  .toggle-pair { position:fixed; bottom:14px; right:14px; z-index:6; width:42px; height:42px; border-radius:13px;
    display:grid; place-items:center; background:rgba(16,21,31,.7); border:1px solid rgba(255,255,255,.12);
    backdrop-filter:blur(14px); cursor:pointer; opacity:.5; }
  .toggle-pair:hover { opacity:1; }
  .status { font-size:12px; color:rgba(245,247,250,.5); }
</style>
</head>
<body>
<video id="v" autoplay playsinline></video>
<div class="badge" id="badge"><span class="d"></span><span id="badgeTxt">Live</span></div>

<div class="panel" id="panel">
  <div class="mark">05</div>
  <h1>05CamLink Viewer</h1>
  <p id="lead">Connect your phone's camera. Use the offer from the 05CamLink app and paste it below.</p>

  <div id="manualUI" class="row" style="flex-direction:column;align-items:center">
    <textarea id="offerIn" placeholder="Paste the OFFER from the phone app"></textarea>
    <button class="btn" id="makeAnswer">Generate answer</button>
    <textarea id="answerOut" placeholder="Your ANSWER appears here — copy it back into the phone" readonly></textarea>
    <div class="row">
      <button class="btn ghost" id="copyAnswer">Copy answer</button>
    </div>
    <div class="status" id="status"></div>
  </div>
</div>

<div class="toggle-pair" id="togglePair" title="Pairing controls">⚙︎</div>

<script>
const $ = s => document.querySelector(s);
const q = new URLSearchParams(location.search);
const session = q.get('session') || '';
const signal = q.get('signal') || '';
const v = $('#v'), panel = $('#panel'), badge = $('#badge');
let pc;

function newPC() {
  pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
  pc.ontrack = e => { v.srcObject = e.streams[0]; };
  pc.onconnectionstatechange = () => {
    if (pc.connectionState === 'connected') goLive();
    if (['disconnected','failed','closed'].includes(pc.connectionState)) { badge.classList.remove('on'); }
  };
  return pc;
}
function goLive() {
  panel.classList.add('hidden');
  badge.classList.add('on');
  v.play().catch(()=>{});
}
function iceDone(p) {
  return new Promise(res => {
    if (p.iceGatheringState === 'complete') return res();
    p.onicegatheringstatechange = () => p.iceGatheringState === 'complete' && res();
    setTimeout(res, 2500);
  });
}

/* ---------- manual signaling ---------- */
$('#makeAnswer').onclick = async () => {
  const raw = $('#offerIn').value.trim();
  if (!raw) { $('#status').textContent = 'Paste the offer first.'; return; }
  try {
    newPC();
    const offer = JSON.parse(atob(raw));
    await pc.setRemoteDescription(offer);
    const ans = await pc.createAnswer();
    await pc.setLocalDescription(ans);
    await iceDone(pc);
    $('#answerOut').value = btoa(JSON.stringify(pc.localDescription));
    $('#status').textContent = 'Answer ready — copy it back into the phone, then you go live.';
  } catch (e) { $('#status').textContent = 'That offer could not be read. Re-copy it from the app.'; }
};
$('#copyAnswer').onclick = () => { navigator.clipboard && navigator.clipboard.writeText($('#answerOut').value); $('#status').textContent = 'Answer copied.'; };

/* ---------- optional WS signaling (one-tap) ---------- */
function startWS() {
  $('#lead').textContent = 'Waiting for the phone over your local network…';
  $('#manualUI').style.display = 'none';
  const ws = new WebSocket(signal);
  ws.onopen = () => ws.send(JSON.stringify({ type:'viewer-join', session }));
  ws.onmessage = async ev => {
    const m = JSON.parse(ev.data);
    if (m.type === 'offer') {
      newPC();
      pc.onicecandidate = e => e.candidate && ws.send(JSON.stringify({ type:'ice', session, candidate:e.candidate }));
      await pc.setRemoteDescription(m.sdp);
      const ans = await pc.createAnswer();
      await pc.setLocalDescription(ans);
      ws.send(JSON.stringify({ type:'answer', session, sdp: pc.localDescription }));
    }
    if (m.type === 'ice' && pc) { try { await pc.addIceCandidate(m.candidate); } catch {} }
  };
  ws.onerror = () => { $('#lead').textContent = 'Signaling server unreachable — switch to manual pairing.'; $('#manualUI').style.display = 'flex'; };
}

$('#togglePair').onclick = () => panel.classList.toggle('hidden');
if (signal) startWS();
</script>
</body>
</html>
